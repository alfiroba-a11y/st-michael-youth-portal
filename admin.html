<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Admin Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Master Admin Portal</h2>
            <div>
                <button class="btn btn-outline-primary btn-sm me-2" onclick="loadMasterData()"><i class="fas fa-sync-alt"></i> Refresh</button>
                <button class="btn btn-success btn-sm" onclick="downloadPortalData()"><i class="fas fa-download"></i> Download Data</button>
            </div>
        </div>

        <!-- Graph Section Added -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card shadow-sm p-3">
                    <h5 class="card-title">Jumuiya Performance Analytics</h5>
                    <div style="position: relative; height: 280px; width: 100%;">
                        <canvas id="jumuiyaPerformanceChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Original Sections and Code Below -->
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card shadow-sm p-4">
                    <h4 class="mb-3">Post Weekly Readings</h4>
                    <form id="readingForm">
                        <div class="mb-2"><input type="text" class="form-control" id="readingTitle" placeholder="Sunday Title / Date" required></div>
                        <div class="mb-2"><textarea class="form-control" id="firstReading" placeholder="First Reading" rows="2" required></textarea></div>
                        <div class="mb-2"><textarea class="form-control" id="psalm" placeholder="Responsorial Psalm" rows="2" required></textarea></div>
                        <div class="mb-2"><textarea class="form-control" id="secondReading" placeholder="Second Reading" rows="2"></textarea></div>
                        <div class="mb-3"><textarea class="form-control" id="gospel" placeholder="Gospel" rows="2" required></textarea></div>
                        <button type="submit" class="btn btn-success w-100">Publish Readings</button>
                    </form>
                </div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="card shadow-sm p-4">
                    <h4 class="mb-3">Create New Poll</h4>
                    <form id="pollForm">
                        <div class="mb-3"><input type="text" class="form-control" id="pollQuestion" placeholder="Poll Question" required></div>
                        <div class="mb-3"><input type="text" class="form-control" id="pollOptions" placeholder="Options separated by comma (e.g. Yes, No, Maybe)" required></div>
                        <button type="submit" class="btn btn-primary w-100">Launch Poll</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Record Modal -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Financial Record</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editRecId">
                    <div class="mb-3"><label>Name</label><input type="text" class="form-control" id="editName"></div>
                    <div class="mb-3"><label>Amount</label><input type="number" class="form-control" id="editAmount"></div>
                    <div class="mb-3"><label>Purpose</label><input type="text" class="form-control" id="editPurpose"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-success" onclick="saveEditedRecord()">Save changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Member Modal -->
    <div class="modal fade" id="editMemberModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="editMemberForm">
                    <div class="modal-header">
                        <h5 class="modal-title">Edit Member Details</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="editUserId">
                        <div class="mb-3"><label>Name</label><input type="text" class="form-control" id="editMemberName" required></div>
                        <div class="mb-3"><label>Phone</label><input type="text" class="form-control" id="editMemberPhone" required></div>
                        <div class="mb-3"><label>Jumuiya</label><input type="text" class="form-control" id="editMemberJumuiya" required></div>
                        <div class="mb-3"><label>Group</label><input type="text" class="form-control" id="editMemberGroup" required></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-success">Save Member</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let performanceChart = null;

        document.addEventListener('DOMContentLoaded', () => {
            initChart();
            loadMasterData();
        });

        function initChart() {
            const ctx = document.getElementById('jumuiyaPerformanceChart').getContext('2d');
            performanceChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Amount Raised (KES)',
                        data: [],
                        backgroundColor: '#198754',
                        borderColor: '#146c43',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        async function loadMasterData() {
            try {
                const res = await fetch('/api/admin/master-data');
                const data = await res.json();
                if (data && data.jumuiyaStats && performanceChart) {
                    performanceChart.data.labels = data.jumuiyaStats.map(j => j.name);
                    performanceChart.data.datasets[0].data = data.jumuiyaStats.map(j => j.raised);
                    performanceChart.update();
                }
            } catch (err) {
                console.error('Failed to load chart stats:', err);
            }
        }

        document.getElementById('readingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                title: document.getElementById('readingTitle').value,
                firstReading: document.getElementById('firstReading').value,
                psalm: document.getElementById('psalm').value,
                secondReading: document.getElementById('secondReading').value,
                gospel: document.getElementById('gospel').value
            };
            await fetch('/api/admin/readings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            document.getElementById('readingForm').reset();
            loadMasterData();
        });

        async function deleteReading(id) {
            if (confirm('Delete this reading?')) {
                await fetch('/api/admin/readings/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
                loadMasterData();
            }
        }

        document.getElementById('pollForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const question = document.getElementById('pollQuestion').value;
            const rawOptions = document.getElementById('pollOptions').value;
            const options = rawOptions.split(',').map(opt => opt.trim()).filter(opt => opt.length > 0);

            const res = await fetch('/api/admin/polls', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question, options })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById('pollForm').reset();
                loadMasterData();
            } else {
                alert('Error creating poll');
            }
        });

        async function deletePoll(id) {
            if (confirm('Delete this poll?')) {
                await fetch('/api/admin/polls/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
                loadMasterData();
            }
        }

        async function togglePublish(id) {
            await fetch('/api/admin/toggle-publish', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
            loadMasterData();
        }

        function openEditModal(id, name, amount, purpose) {
            document.getElementById('editRecId').value = id;
            document.getElementById('editName').value = name;
            document.getElementById('editAmount').value = amount;
            document.getElementById('editPurpose').value = purpose;
            new bootstrap.Modal(document.getElementById('editModal')).show();
        }

        async function saveEditedRecord() {
            const payload = {
                id: document.getElementById('editRecId').value,
                name: document.getElementById('editName').value,
                amount: document.getElementById('editAmount').value,
                purpose: document.getElementById('editPurpose').value
            };
            await fetch('/api/admin/edit-jumuiya-record', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
            loadMasterData();
        }

        function openEditMemberModal(id, name, phone, jumuiya, group) {
            document.getElementById('editUserId').value = id;
            document.getElementById('editMemberName').value = name;
            document.getElementById('editMemberPhone').value = phone;
            document.getElementById('editMemberJumuiya').value = jumuiya;
            document.getElementById('editMemberGroup').value = group;
            new bootstrap.Modal(document.getElementById('editMemberModal')).show();
        }

        document.getElementById('editMemberForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                id: document.getElementById('editUserId').value,
                name: document.getElementById('editMemberName').value,
                phone: document.getElementById('editMemberPhone').value,
                jumuiya: document.getElementById('editMemberJumuiya').value,
                group: document.getElementById('editMemberGroup').value
            };
            await fetch('/api/admin/edit-member', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            bootstrap.Modal.getInstance(document.getElementById('editMemberModal')).hide();
            loadMasterData();
        });

        async function approvePasswordReset(id) {
            if (confirm('Approve this new password request?')) {
                await fetch('/api/admin/approve-password-reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
                loadMasterData();
            }
        }

        async function deleteJumuiyaRecord(id) {
            if (confirm('Are you sure you want to permanently delete this submission record?')) {
                await fetch('/api/admin/delete-jumuiya-record', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
                loadMasterData();
            }
        }

        async function approveUser(id) {
            await fetch('/api/admin/approve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
            loadMasterData();
        }

        async function rejectUser(id) {
            if (confirm('Are you sure you want to reject this registration?')) {
                await fetch('/api/admin/reject', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
                loadMasterData();
            }
        }

        async function removeMember(id) {
            if (confirm('Are you sure you want to remove this member?')) {
                await fetch('/api/admin/remove-member', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
                loadMasterData();
            }
        }

        async function downloadPortalData() {
            try {
                window.open('/api/admin/download-data', '_blank');
            } catch (error) {
                alert('Error downloading portal data: ' + error.message);
            }
        }
    </script>
</body>
</html>
