<!-- Download Document Selection Modal -->
<div class="modal fade" id="downloadModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content p-4">
            <h4 class="mb-3 text-success">📥 Download Portal Report</h4>
            <p class="text-muted small">Select your preferred document format and data scope to export.</p>
            <form id="downloadForm" onsubmit="executeDownload(event)">
                <div class="mb-3">
                    <label class="form-label fw-bold">Document Format</label>
                    <select id="downloadFormat" class="form-select">
                        <option value="pdf">PDF Document (.pdf)</option>
                        <option value="excel">Excel Spreadsheet (.xlsx / .csv)</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Data Scope</label>
                    <select id="downloadScope" class="form-select">
                        <option value="financial">Financial Contributions Summary Only</option>
                        <option value="all">Complete Portal Data (All Jumuiyas & Members)</option>
                        <option value="members">Registered Members Directory Only</option>
                    </select>
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success btn-sm">Download Document</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Edit Record Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Jumuiya Record</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editRecId">
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" id="editName" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Amount</label>
                    <input type="number" id="editAmount" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Purpose</label>
                    <input type="text" id="editPurpose" class="form-control">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary btn-sm" onclick="saveEditedRecord()">Save Changes</button>
            </div>
        </div>
    </div>
</div>

<!-- Edit Member Details Modal (Names, Phone, Group) -->
<div class="modal fade" id="editMemberModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content p-4">
            <h4 class="mb-3">Edit Member Details</h4>
            <form id="editMemberForm">
                <input type="hidden" id="editUserId">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="editMemberName" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="text" id="editMemberPhone" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Jumuiya</label>
                    <input type="text" id="editMemberJumuiya" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Group</label>
                    <input type="text" id="editMemberGroup" class="form-control" required placeholder="e.g. Choir, Youth, Main">
                </div>
                <div class="d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer class="text-center py-3 mt-auto text-muted small border-top bg-white">
    &copy; 2026 St. Michael Kasaini Youth Portal. Created and managed by Robert Wambua. All rights reserved.
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let cachedMasterData = {};
    let myJumuiyaChart = null;

    function maskPhoneNumber(phone) {
        if (!phone || phone === '-') return '-';
        const str = String(phone).trim();
        if (str.length <= 6) return '***';
        const start = str.slice(0, 4);
        const end = str.slice(-3);
        return `${start}***${end}`;
    }

    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('adminUser').value;
        const password = document.getElementById('adminPass').value;
        const alertBox = document.getElementById('adminAlert');

        try {
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (data.success) {
                document.getElementById('loginWrapper').classList.remove('my-auto');
                document.getElementById('loginWrapper').classList.add('d-none');
                document.getElementById('dashboardSection').classList.remove('d-none');
                loadMasterData();
            } else {
                alertBox.textContent = data.message || 'Invalid credentials';
                alertBox.className = 'alert alert-danger small';
                alertBox.classList.remove('d-none');
            }
        } catch (err) {
            alertBox.textContent = 'Server connection error during login.';
            alertBox.className = 'alert alert-danger small';
            alertBox.classList.remove('d-none');
        }
    });

    async function loadMasterData() {
        const res = await fetch('/api/admin/data');
        const data = await res.json();
        if (data.success) {
            cachedMasterData = data;
            const globalTarget = data.annualTarget || 500000;
            document.getElementById('annualTargetInput').value = globalTarget;
            let totalCollectedAll = 0;

            let cHtml = '';
            const contributionsMap = data.contributionsMap || {};
            const defaultJumuiyaTarget = Math.round(globalTarget / 11);
            const jumuiyaTargetsObj = data.jumuiyaTargets || {};
            let targetInputsHtml = '';

            const jumuiyaLabels = Object.keys(contributionsMap);
            const jumuiyaCollectedData = [];
            const jumuiyaTargetData = [];

            for (const [jumuiya, amount] of Object.entries(contributionsMap)) {
                const collected = Number(amount) || 0;
                totalCollectedAll += collected;
                
                const jumuiyaTarget = jumuiyaTargetsObj[jumuiya] !== undefined ? jumuiyaTargetsObj[jumuiya] : defaultJumuiyaTarget;
                const percentage = jumuiyaTarget > 0 ? Math.min(Math.round((collected / jumuiyaTarget) * 100), 100) : 0;
                
                jumuiyaCollectedData.push(collected);
                jumuiyaTargetData.push(jumuiyaTarget);
                
                cHtml += `<tr>
                    <td><strong>⛪ ${jumuiya}</strong></td>
                    <td><span class="badge bg-primary fs-6">KES ${collected.toLocaleString()}</span></td>
                    <td><span class="text-muted fw-bold">KES ${Number(jumuiyaTarget).toLocaleString()}</span></td>
                    <td>
                        <div class="d-flex align-items-center">
                            <div class="progress flex-grow-1 me-2" style="height: 15px;">
                                <div class="progress-bar bg-info" role="progressbar" style="width: ${percentage}%;" aria-valuenow="${percentage}" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                            <small class="fw-bold">${percentage}%</small>
                        </div>
                    </td>
                    <td>
                        <button class="btn btn-outline-primary btn-sm" onclick="openTargetModalForJumuiya('${jumuiya}', ${jumuiyaTarget})">Edit Target</button>
                    </td>
                </tr>`;

                targetInputsHtml += `
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">${jumuiya} Target (KES)</label>
                        <input type="number" class="form-control jumuiya-target-field" data-jumuiya="${jumuiya}" value="${jumuiyaTarget}">
                    </div>
                `;
            }
            document.getElementById('contributionsSummaryList').innerHTML = cHtml || '<tr><td colspan="5" class="text-muted">No contributions recorded.</td></tr>';
            document.getElementById('jumuiyaTargetsContainer').innerHTML = targetInputsHtml;

            // Render Chart.js Graph
            const ctx = document.getElementById('jumuiyaChart').getContext('2d');
            if (myJumuiyaChart instanceof Chart) {
                myJumuiyaChart.destroy();
            }
            myJumuiyaChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: jumuiyaLabels,
                    datasets: [
                        {
                            label: 'Collected (KES)',
                            data: jumuiyaCollectedData,
                            backgroundColor: 'rgba(25, 135, 84, 0.7)',
                            borderColor: 'rgba(25, 135, 84, 1)',
                            borderWidth: 1
                        },
                        {
                            label: 'Target (KES)',
                            data: jumuiyaTargetData,
                            backgroundColor: 'rgba(13, 110, 253, 0.3)',
                            borderColor: 'rgba(13, 110, 253, 1)',
                            borderWidth: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });

            // Update Overall Progress Card
            const overallPercentage = globalTarget > 0 ? Math.min(Math.round((totalCollectedAll / globalTarget) * 100), 100) : 0;
            document.getElementById('totalCollectedDisplay').textContent = `KES ${totalCollectedAll.toLocaleString()}`;
            document.getElementById('totalTargetDisplay').textContent = `KES ${globalTarget.toLocaleString()}`;
            document.getElementById('goalInputDisplay').textContent = globalTarget.toLocaleString();
            document.getElementById('progressPercentageText').textContent = `${overallPercentage}% Achieved`;
            
            const progressBar = document.getElementById('overallProgressBar');
            progressBar.style.width = `${overallPercentage}%`;
            progressBar.setAttribute('aria-valuenow', overallPercentage);
            progressBar.textContent = `${overallPercentage}%`;

            // Events Admin List
            let eHtml = '<ul class="list-group">';
            if (data.events && data.events.length > 0) {
                data.events.forEach(ev => {
                    const eventId = ev.id || ev._id;
                    eHtml += `<li class="list-group-item d-flex justify-content-between align-items-center">
                        <div><strong>${ev.title || 'Untitled Event'}</strong> (${ev.date || ''})<br><small>${ev.description || ''}</small></div>
                        <button class="btn btn-outline-danger btn-sm" onclick="deleteEvent('${eventId}')">Delete</button>
                    </li>`;
                });
            } else {
                eHtml += '<li class="list-group-item text-muted">No active events posted.</li>';
            }
            eHtml += '</ul>';
            document.getElementById('eventsListAdmin').innerHTML = eHtml;

            // Readings Admin List
            let rHtml = '<ul class="list-group">';
            if (data.readings && data.readings.length > 0) {
                data.readings.forEach(rd => {
                    const readingId = rd.id || rd._id;
                    rHtml += `<li class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <strong>${rd.title || 'Mass Readings'}</strong><br>
                            <small><strong>1st:</strong> ${rd.firstReading || '-'}</small><br>
                            <small><strong>Psalm:</strong> ${rd.psalm || '-'}</small><br>
                            <small><strong>2nd:</strong> ${rd.secondReading || '-'}</small><br>
                            <small><strong>Gospel:</strong> ${rd.gospel || '-'}</small>
                        </div>
                        <button class="btn btn-outline-danger btn-sm" onclick="deleteReading('${readingId}')">Delete</button>
                    </li>`;
                });
            } else {
                rHtml += '<li class="list-group-item text-muted">No active readings posted.</li>';
            }
            rHtml += '</ul>';
            document.getElementById('readingsListAdmin').innerHTML = rHtml;

            // Password Reset Requests Table
            let prHtml = '<table class="table table-bordered align-middle"><thead><tr><th>Name</th><th>Phone</th><th>Status</th><th>Action</th></tr></thead><tbody>';
            if (!data.passwordResets || data.passwordResets.length === 0) {
                prHtml += '<tr><td colspan="4" class="text-muted">No pending password reset requests.</td></tr>';
            } else {
                data.passwordResets.forEach(pr => {
                    const memberId = pr.id || pr._id;
                    prHtml += `<tr>
                        <td>${pr.name}</td>
                        <td>${maskPhoneNumber(pr.phone)}</td>
                        <td><span class="badge bg-warning text-dark">Forgot Password / Awaiting Approval</span></td>
                        <td><button class="btn btn-success btn-sm" onclick="approvePasswordReset('${memberId}')">Approve New Password</button></td>
                    </tr>`;
                });
            }
            prHtml += '</tbody></table>';
            document.getElementById('passwordResetList').innerHTML = prHtml;

            // Jumuiya Submissions Table
            let sHtml = '';
            if (!data.jumuiyaSubmissions || data.jumuiyaSubmissions.length === 0) {
                sHtml = '<tr><td colspan="7" class="text-muted text-center">No submissions received yet from Jumuiya admins.</td></tr>';
            } else {
                data.jumuiyaSubmissions.forEach((s, index) => {
                    sHtml += `
                        <tr>
                            <td><strong>${s.jumuiyaName}</strong></td>
                            <td>${index + 1}</td>
                            <td>${s.id.slice(-6)}</td>
                            <td>${s.name} <br><small class="text-muted">KES ${s.amount || 0}</small></td>
                            <td>${s.purpose}</td>
                            <td>${s.published ? '<span class="badge bg-success">Published</span>' : '<span class="badge bg-warning text-dark">Draft / Hidden</span>'}</td>
                            <td>
                                <button class="btn btn-sm ${s.published ? 'btn-outline-secondary' : 'btn-success'} mb-1" onclick="togglePublish('${s.id}')">
                                    ${s.published ? 'Unpublish' : 'Publish'}
                                </button>
                                <button class="btn btn-sm btn-outline-primary mb-1" onclick="openEditModal('${s.id}', '${s.name}', '${s.amount || 0}', '${s.purpose}')">Edit</button>
                                <button class="btn btn-sm btn-outline-danger mb-1" onclick="deleteJumuiyaRecord('${s.id}')">Delete</button>
                            </td>
                        </tr>
                    `;
                });
            }
            document.getElementById('masterJumuiyaRecordsList').innerHTML = sHtml;

            // Pending Registrations Table
            let pHtml = '<table class="table table-bordered"><thead><tr><th>Name</th><th>Phone</th><th>Jumuiya</th><th>Group</th><th>Action</th></tr></thead><tbody>';
            if (!data.pending || data.pending.length === 0) {
                pHtml += '<tr><td colspan="5" class="text-muted">No pending registrations.</td></tr>';
            } else {
                data.pending.forEach(p => {
                    pHtml += `<tr><td>${p.name}</td><td>${maskPhoneNumber(p.phone)}</td><td>${p.jumuiya}</td><td>${p.group}</td><td><button class="btn btn-success btn-sm" onclick="approveUser('${p.id}')">Approve</button> <button class="btn btn-outline-danger btn-sm" onclick="rejectUser('${p.id}')">Reject</button></td></tr>`;
                });
            }
            pHtml += '</tbody></table>';
            document.getElementById('pendingList').innerHTML = pHtml;

            // Members Table
            let mHtml = '<table class="table table-bordered table-striped"><thead><tr><th>ID</th><th>Name</th><th>Jumuiya</th><th>Phone</th><th>Group</th><th>Action</th></tr></thead><tbody>';
            if (!data.members || data.members.length === 0) {
                mHtml += '<tr><td colspan="6" class="text-muted">No registered members yet.</td></tr>';
            } else {
                data.members.forEach((m) => {
                    const memberId = m.id || m._id;
                    const safeName = (m.name || '').replace(/'/g, "\\'");
                    const safePhone = (m.phone || '').replace(/'/g, "\\'");
                    const safeJumuiya = (m.jumuiya || '').replace(/'/g, "\\'");
                    const safeGroup = (m.group || '').replace(/'/g, "\\'");

                    mHtml += `<tr>
                        <td><strong class="text-primary">${m.customId || 'N/A'}</strong></td>
                        <td>${m.name}</td>
                        <td><span class="badge bg-info text-dark">${m.jumuiya || 'St. Michael'}</span></td>
                        <td>${maskPhoneNumber(m.phone)}</td>
                        <td>${m.group}</td>
                        <td>
                            <button class="btn btn-outline-primary btn-sm mb-1" onclick="openEditMemberModal('${memberId}', '${safeName}', '${safePhone}', '${safeJumuiya}', '${safeGroup}')">Edit</button>
                            <button class="btn btn-danger btn-sm mb-1" onclick="removeMember('${memberId}')">Remove</button>
                        </td>
                    </tr>`;
                });
            }
            mHtml += '</tbody></table>';
            document.getElementById('memberList').innerHTML = mHtml;
        }
    }

    // Target Modal Trigger Helpers
    function openTargetModal() {
        new bootstrap.Modal(document.getElementById('targetModal')).show();
    }

    function openTargetModalForJumuiya(jumuiyaName, currentTarget) {
        openTargetModal();
        setTimeout(() => {
            const inputField = document.querySelector(`.jumuiya-target-field[data-jumuiya="${jumuiyaName}"]`);
            if (inputField) {
                inputField.focus();
                inputField.select();
            }
        }, 300);
    }

    document.getElementById('targetForm')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const annualTarget = document.getElementById('annualTargetInput').value;
        
        const jumuiyaTargets = {};
        document.querySelectorAll('.jumuiya-target-field').forEach(input => {
            const jName = input.getAttribute('data-jumuiya');
            jumuiyaTargets[jName] = Number(input.value) || 0;
        });

        await fetch('/api/admin/update-target', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ target: annualTarget, jumuiyaTargets })
        });
        bootstrap.Modal.getInstance(document.getElementById('targetModal')).hide();
        loadMasterData();
    });

    // Download Modal Handlers
    function openDownloadModal(defaultFormat = 'pdf') {
        document.getElementById('downloadFormat').value = defaultFormat;
        new bootstrap.Modal(document.getElementById('downloadModal')).show();
    }

    function executeDownload(e) {
        e.preventDefault();
        const format = document.getElementById('downloadFormat').value;
        const scope = document.getElementById('downloadScope').value;
        
        bootstrap.Modal.getInstance(document.getElementById('downloadModal')).hide();
        window.open(`/api/admin/download-data?format=${format}&scope=${scope}`, '_blank');
    }

    // Event Form Submission
    document.getElementById('eventForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            title: document.getElementById('eventTitle').value,
            date: document.getElementById('eventDate').value,
            description: document.getElementById('eventDesc').value
        };
        await fetch('/api/admin/events', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        document.getElementById('eventForm').reset();
        loadMasterData();
    });

    async function deleteEvent(id) {
        if (confirm('Delete this event?')) {
            await fetch('/api/admin/events/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
            loadMasterData();
        }
    }

    // Reading Form Submission
    document.getElementById('readingForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            title: document.getElementById('readingTitle').value,
            firstReading: document.getElementById('firstReading').value,
            psalm: document.getElementById('psalm').value,
            secondReading: document.getElementById('secondReading').value,
            gospel: document.getElementById('gospel').value
        };
        await fetch('/api/admin/readings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        document.getElementById('readingForm').reset();
        loadMasterData();
    });

    async function deleteReading(id) {
        if (confirm('Delete this reading?')) {
            await fetch('/api/admin/readings/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
            loadMasterData();
        }
    }

    async function togglePublish(id) {
        await fetch('/api/admin/toggle-publish', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
        loadMasterData();
    }

    function openEditModal(id, name, amount, purpose) {
        document.getElementById('editRecId').value = id;
        document.getElementById('editName').value = name;
        document.getElementById('editAmount').value = amount;
        document.getElementById('editPurpose').value = purpose;
        new bootstrap.Modal(document.getElementById('editModal')).show();
    }

    async function saveEditedRecord() {
        const payload = {
            id: document.getElementById('editRecId').value,
            name: document.getElementById('editName').value,
            amount: document.getElementById('editAmount').value,
            purpose: document.getElementById('editPurpose').value
        };
        await fetch('/api/admin/edit-jumuiya-record', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
        loadMasterData();
    }

    // Member Edit Functions
    function openEditMemberModal(id, name, phone, jumuiya, group) {
        document.getElementById('editUserId').value = id;
        document.getElementById('editMemberName').value = name;
        document.getElementById('editMemberPhone').value = phone;
        document.getElementById('editMemberJumuiya').value = jumuiya;
        document.getElementById('editMemberGroup').value = group;
        new bootstrap.Modal(document.getElementById('editMemberModal')).show();
    }

    document.getElementById('editMemberForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            id: document.getElementById('editUserId').value,
            name: document.getElementById('editMemberName').value,
            phone: document.getElementById('editMemberPhone').value,
            jumuiya: document.getElementById('editMemberJumuiya').value,
            group: document.getElementById('editMemberGroup').value
        };
        await fetch('/api/admin/edit-member', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        bootstrap.Modal.getInstance(document.getElementById('editMemberModal')).hide();
        loadMasterData();
    });

    async function approvePasswordReset(id) {
        if (confirm('Approve this new password request?')) {
            await fetch('/api/admin/approve-password-reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
            loadMasterData();
        }
    }

    async function deleteJumuiyaRecord(id) {
        if (confirm('Are you sure you want to permanently delete this submission record?')) {
            await fetch('/api/admin/delete-jumuiya-record', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
            loadMasterData();
        }
    }

    async function approveUser(id) {
        await fetch('/api/admin/approve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
        loadMasterData();
    }

    async function rejectUser(id) {
        if (confirm('Are you sure you want to reject this registration?')) {
            await fetch('/api/admin/reject', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
            loadMasterData();
        }
    }

    async function removeMember(id) {
        if (confirm('Are you sure you want to remove this member?')) {
            await fetch('/api/admin/remove-member', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
            loadMasterData();
        }
    }
</script>
</body>
</html>
